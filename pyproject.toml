[project]
name = "leaseguard"
version = "0.1.0"
description = "Lease analysis with verified citations"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
